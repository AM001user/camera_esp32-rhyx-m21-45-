[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600

monitor_rts = 0
monitor_dtr = 0

board_build.partitions = huge_app.csv

; CORE_DEBUG_LEVEL : 0=None 1=Error 2=Warn 3=Info 4=Debug 5=Verbose
; Le niveau Verbose (5) flood le port serie a chaque requete HTTP et ralentit
; le traitement -> on repasse a Error (1) pour la vitesse, remonte a 5
; uniquement quand tu as besoin de deboguer en detail.
build_flags =
    -DCORE_DEBUG_LEVEL=1